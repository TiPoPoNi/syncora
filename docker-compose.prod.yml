services:
  postgres:
    image: postgres:16-alpine
    container_name: prs-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prs_db}
      POSTGRES_USER: ${POSTGRES_USER:-prs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prs_secure_pass_2026}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prs_user} -d ${POSTGRES_DB:-prs_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prs-backend-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-prs_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-prs_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-prs_secure_pass_2026}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      APP_JWT_SECRET: ${APP_JWT_SECRET:-}
      AI_SERVICE_URL: http://ai-service:8000
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@prs-system.local}
      MAIL_TLS: ${MAIL_TLS:-true}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 3

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: prs-ai-service-prod
    restart: always
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_SERVICE_PORT: 8000
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prs-frontend-prod
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_prod_data:
